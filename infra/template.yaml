AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ultra-flashcards - Full Serverless Engine & Generative AI Infrastructure

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.12
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_NAME: !Ref AnkiSaaSTable
        DOCUMENTS_BUCKET: !Ref DocumentsBucket
        POWERTOOLS_SERVICE_NAME: fsrs-engine
        LOG_LEVEL: INFO

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Environment stage (dev, staging, prod)

Resources:
  # =========================================================================
  # DynamoDB Table - Single Table Design
  # =========================================================================
  AnkiSaaSTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'AnkiSaaS-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # =========================================================================
  # DynamoDB Table - Single Table Design
  # =========================================================================
  PagamentosTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: !Sub 'geracao_de_pagamentos-${Stage}'

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S

        - AttributeName: SK
          AttributeType: S

        - AttributeName: GSI1PK
          AttributeType: S

        - AttributeName: GSI1SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH

        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:

        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH

            - AttributeName: GSI1SK
              KeyType: RANGE

          Projection:
            ProjectionType: ALL

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      SSESpecification:
        SSEEnabled: true

  # =========================================================================
  # S3 Bucket for Document Uploads & OCR
  # =========================================================================
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ultra-flashcards-docs-${Stage}-${AWS::AccountId}'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # =========================================================================
  # SQS Queue for Asynchronous Document Extraction
  # =========================================================================
  DocumentProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'ultra-flashcards-doc-queue-${Stage}'
      VisibilityTimeout: 90

  # =========================================================================
  # Cognito Authentication - User Pool & Client
  # =========================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'ultra-flashcards-user-pool-${Stage}'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'ultra-flashcards-client-${Stage}'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  # =========================================================================
  # HTTP API (API Gateway v2)
  # =========================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - '*'
          - Authorization
          - Content-Type
          - Accept
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
          - X-User-Id
        AllowOrigins:
          - '*'
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              Audience:
                - !Ref CognitoUserPoolClient
              Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'

  # =========================================================================
  # Lambda Functions - Fase 1: Criação
  # =========================================================================
  CreateNoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.create_note.lambda_handler
      CodeUri: ../src/
      Description: Cria notas e gera cartões derivados
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnkiSaaSTable
      Events:
        CreateNote:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes
            Method: POST

  BatchCreateNotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.batch_create_notes.lambda_handler
      CodeUri: ../src/
      Description: Criação em lote de notas e cartões (JSON, CSV, Cloze)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnkiSaaSTable
      Events:
        BatchCreateNotes:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notes/batch
            Method: POST

  AiGenerateCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.ai_generate_cards.lambda_handler
      CodeUri: ../src/
      Description: Mineração síncrona com Amazon Bedrock (Quick Start, Texto, Links, YouTube)
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        GenerateCards:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ai/generate-cards
            Method: POST
        ScrapeLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ai/scrape-link
            Method: POST
        YoutubeTranscript:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ai/youtube-transcript
            Method: POST

  DocumentProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.document_processor.lambda_handler
      CodeUri: ../src/
      Description: Upload de documentos via S3 presigned URL e consulta de jobs
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub 'ultra-flashcards-docs-${Stage}-${AWS::AccountId}'
        - DynamoDBCrudPolicy:
            TableName: !Ref AnkiSaaSTable
      Events:
        GetPresignedUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/presigned-url
            Method: POST
        GetJobStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /documents/jobs/{jobId}
            Method: GET

  # =========================================================================
  # Lambda Functions - Fase 2: Estudo
  # =========================================================================
  GetDueCardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.get_due_cards.lambda_handler
      CodeUri: ../src/
      Description: Consulta cartões vencidos com paginação e filtro de deck
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AnkiSaaSTable
      Events:
        GetDueCards:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /study/due
            Method: GET

  ProcessReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.process_review.lambda_handler
      CodeUri: ../src/
      Description: Processa revisão com FSRS v4.5 e registra histórico de logs
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnkiSaaSTable
      Events:
        ProcessReview:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /study/review
            Method: POST

  AiStudyTutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.ai_study_tutor.lambda_handler
      CodeUri: ../src/
      Description: Tutor IA, avaliação de resposta aberta, quiz e savepoints
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnkiSaaSTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        EvaluateAnswer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /study/evaluate-answer
            Method: POST
        AiAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /study/ai-action
            Method: POST
        GenerateQuiz:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /study/generate-quiz
            Method: POST
        AdaptiveSuggestions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /study/adaptive-suggestions
            Method: POST
        PostSavepoint:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /study/session-savepoint
            Method: POST
        GetSavepoint:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /study/session-savepoint
            Method: GET

  # =========================================================================
  # Lambda Functions - Fase 3: Analytics & Gestão
  # =========================================================================
  AnalyticsSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.analytics_summary.lambda_handler
      CodeUri: ../src/
      Description: Cálculo de streak diário, heatmap, acurácia e weak topics
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AnkiSaaSTable
      Events:
        GetAnalyticsSummary:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /analytics/summary
            Method: GET

  ManageDecksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.manage_decks.lambda_handler
      CodeUri: ../src/
      Description: CRUD completo de decks, métricas consolidadas e compartilhamento
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnkiSaaSTable
      Events:
        GetDecks:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /decks
            Method: GET
        CreateDeck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /decks
            Method: POST
        UpdateDeck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /decks/{deckId}
            Method: PUT
        DeleteDeck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /decks/{deckId}
            Method: DELETE
        ShareDeck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /decks/{deckId}/share
            Method: POST
        ImportSharedDeck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /decks/import-shared
            Method: POST

  UserPreferencesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.user_preferences.lambda_handler
      CodeUri: ../src/
      Description: Preferências do usuário e parâmetros do algoritmo FSRS
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AnkiSaaSTable
      Events:
        GetPreferences:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /user/preferences
            Method: GET
        UpdatePreferences:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /user/preferences
            Method: PUT

  # =========================================================================
  # Pagamentos - Asaas PIX
  # =========================================================================

  PaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.payments.lambda_handler
      CodeUri: ../src/
      Description: Cria cobrança PIX no Asaas e retorna QR Code + Pix Copia e Cola
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PagamentosTable
      Environment:
        Variables:
          ASAAS_API_URL: https://api-sandbox.asaas.com/v3
          ASAAS_API_KEY: $aact_hmlg_000MzkwODA2MWY2OGM3MWRlMDU2NWM3MzJlNzZmNGZhZGY6OmVjYTE2OGY3LWVjM2QtNDZlMC1hODJiLThlM2FhMzcwYzhmZjo6JGFhY2hfN2E1ZTEyZTUtNmEyOC00NzdhLWE4ZDctMTY2ZTNmN2JmYTUz
          TABLE_NAME: !Ref PagamentosTable
      Events:
        CreatePixPayment:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /payments/pix/geraqrcode
            Method: POST
            Auth:
              Authorizer: NONE

  # =========================================================================
  # Pagamentos_retorno - Asaas PIX
  # =========================================================================

  RetornosPaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.retorno_payment_assas.lambda_handler
      CodeUri: ../src/
      Description: recebe o retorno do pagamento do Asaas e atualiza o status no DynamoDB
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PagamentosTable
      Environment:
        Variables:
          ASAAS_API_URL: https://api-sandbox.asaas.com/v3
          ASAAS_API_KEY: $aact_hmlg_000MzkwODA2MWY2OGM3MWRlMDU2NWM3MzJlNzZmNGZhZGY6OmVjYTE2OGY3LWVjM2QtNDZlMC1hODJiLThlM2FhMzcwYzhmZjo6JGFhY2hfN2E1ZTEyZTUtNmEyOC00NzdhLWE4ZDctMTY2ZTNmN2JmYTUz
          TABLE_NAME: !Ref PagamentosTable
      Events:
        RetornoPixPayment:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /payments/pix/retorno
            Method: POST
            Auth:
              Authorizer: NONE

Outputs:
  HttpApiUrl:
    Description: Base URL for HTTP API
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  DynamoDBTableName:
    Description: Name of the DynamoDB table
    Value: !Ref AnkiSaaSTable
  DynamoDBTableArn:
    Description: ARN of the DynamoDB table
    Value: !GetAtt AnkiSaaSTable.Arn
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: Cognito User Pool App Client ID
    Value: !Ref CognitoUserPoolClient
  CognitoUserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn
